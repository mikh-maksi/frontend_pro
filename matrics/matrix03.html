<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = 3;
        let m = 3;
        let aa = []

        for (let i=0;i<n;i+=1){
             let new_aa = [];
            for (let j=0;j<m;j+=1){
                new_aa.push(Math.random())
            }
            aa.push(new_aa);
        }

        // diagonal
        let sum = 0;

        for (let i = 0; i < aa.length; i++) {
        for (let j = 0; j < aa[i].length; j++) {
            if (i==j){
                sum += aa[i][j];
            }
        }
        }
        console.log(aa);
        console.log(sum);
    </script>
</body>
</html>
