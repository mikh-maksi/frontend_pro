<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Виведення матриці в DOM</title>

  <style>
    table {
      border-collapse: collapse;
      margin-top: 20px;
    }

    td {
      border: 1px solid black;
      padding: 10px;
      text-align: center;
      width: 50px;
    }
  </style>
</head>
<body>

  <div id="matrix-container"></div>

  <script>
    
    function renderMatrix(matrix, containerId = "matrix-container") {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      const table = document.createElement("table");
      for (let i = 0; i < matrix.length; i++) {
        const tr = document.createElement("tr");
        for (let j = 0; j < matrix[i].length; j++) {
          const td = document.createElement("td");
          td.textContent = matrix[i][j];
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
      container.appendChild(table);
    }
        let n = 3;
        let m = 3;
        let aa = []

        for (let i=0;i<n;i+=1){
             let new_aa = [];
            for (let j=0;j<m;j+=1){
                new_aa.push(Math.random())
            }
            aa.push(new_aa);
        }



    // Приклад матриці
        let sum = 0;
        let min = 100000;
        let i_min = -1;
        let j_min = -1;

        for (let i = 0; i < aa.length; i++) {
        for (let j = 0; j < aa[i].length; j++) {
            if (min>aa[i][j]){
                min = aa[i][j];
                i_min = i;
                j_min = j;
            }
        }
        }
    // Виведення
    renderMatrix(aa, "matrix-container");

  </script>

</body>
</html>
