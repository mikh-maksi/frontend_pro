<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Обернена матриця методом Гауса</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .controls {
      margin-bottom: 20px;
    }

    button {
      padding: 8px 14px;
      margin-right: 10px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      margin-top: 15px;
    }

    td {
      border: 1px solid #444;
      padding: 0;
    }

    input {
      width: 70px;
      height: 40px;
      border: none;
      text-align: center;
      font-size: 16px;
    }

    .result {
      margin-top: 25px;
    }

    .matrix-title {
      margin-top: 20px;
      font-weight: bold;
    }

    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2>Обернена матриця методом Гауса</h2>

  <div class="controls">
    <label>Розмір матриці:</label>

    <select id="matrixSize">
      <option value="2">2 × 2</option>
      <option value="3" selected>3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5">5 × 5</option>
    </select>

    <button onclick="generateMatrix()">
      Створити матрицю
    </button>

    <button onclick="calculateInverse()">
      Знайти обернену матрицю
    </button>
  </div>

  <div id="matrixContainer"></div>

  <div class="error" id="errorBlock"></div>

  <div class="result">
    <div class="matrix-title">Обернена матриця:</div>
    <div id="inverseContainer"></div>
  </div>

  <script>
    let size = 3;

    // Створення матриці
    function generateMatrix() {
      size = Number(document.getElementById("matrixSize").value);

      const container = document.getElementById("matrixContainer");
      container.innerHTML = "";

      const table = document.createElement("table");

      for (let i = 0; i < size; i++) {
        const tr = document.createElement("tr");

        for (let j = 0; j < size; j++) {
          const td = document.createElement("td");

          const input = document.createElement("input");
          input.type = "number";
          input.value = i === j ? 1 : 0;

          input.dataset.row = i;
          input.dataset.col = j;

          td.appendChild(input);
          tr.appendChild(td);
        }

        table.appendChild(tr);
      }

      container.appendChild(table);

      document.getElementById("inverseContainer").innerHTML = "";
      document.getElementById("errorBlock").textContent = "";
    }

    // Отримання матриці
    function getMatrix() {
      const matrix = [];

      for (let i = 0; i < size; i++) {
        const row = [];

        for (let j = 0; j < size; j++) {
          const input = document.querySelector(
            `[data-row="${i}"][data-col="${j}"]`
          );

          row.push(Number(input.value));
        }

        matrix.push(row);
      }

      return matrix;
    }

    // Метод Гауса-Жордана
    function inverseMatrix(matrix) {
      const n = matrix.length;

      // Створення розширеної матриці
      const augmented = [];

      for (let i = 0; i < n; i++) {
        augmented[i] = [];

        for (let j = 0; j < n; j++) {
          augmented[i][j] = matrix[i][j];
        }

        for (let j = 0; j < n; j++) {
          augmented[i][j + n] = (i === j) ? 1 : 0;
        }
      }

      // Прямий хід Гауса
      for (let i = 0; i < n; i++) {

        // Пошук головного елемента
        let maxRow = i;

        for (let k = i + 1; k < n; k++) {
          if (Math.abs(augmented[k][i]) >
              Math.abs(augmented[maxRow][i])) {
            maxRow = k;
          }
        }

        // Обмін рядків
        [augmented[i], augmented[maxRow]] =
          [augmented[maxRow], augmented[i]];

        // Перевірка на виродженість
        if (augmented[i][i] === 0) {
          return null;
        }

        // Нормалізація рядка
        const pivot = augmented[i][i];

        for (let j = 0; j < 2 * n; j++) {
          augmented[i][j] /= pivot;
        }

        // Обнулення інших рядків
        for (let k = 0; k < n; k++) {

          if (k !== i) {
            const factor = augmented[k][i];

            for (let j = 0; j < 2 * n; j++) {
              augmented[k][j] -=
                factor * augmented[i][j];
            }
          }
        }
      }

      // Виділення оберненої матриці
      const inverse = [];

      for (let i = 0; i < n; i++) {
        inverse[i] = augmented[i].slice(n, 2 * n);
      }

      return inverse;
    }

    // Виведення матриці
    function renderResultMatrix(matrix, containerId) {
      const container =
        document.getElementById(containerId);

      container.innerHTML = "";

      const table = document.createElement("table");

      matrix.forEach(row => {
        const tr = document.createElement("tr");

        row.forEach(value => {
          const td = document.createElement("td");

          td.style.padding = "10px";
          td.style.minWidth = "80px";

          td.textContent =
            Number(value.toFixed(4));

          tr.appendChild(td);
        });

        table.appendChild(tr);
      });

      container.appendChild(table);
    }

    // Обчислення
    function calculateInverse() {
      const matrix = getMatrix();

      const inverse = inverseMatrix(matrix);

      if (!inverse) {
        document.getElementById("errorBlock")
          .textContent =
          "Матриця не має оберненої.";

        document.getElementById("inverseContainer")
          .innerHTML = "";

        return;
      }

      document.getElementById("errorBlock")
        .textContent = "";

      renderResultMatrix(
        inverse,
        "inverseContainer"
      );
    }

    // Початкове створення
    generateMatrix();
  </script>

</body>
</html>
